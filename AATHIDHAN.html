<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Email Signature</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .signature-card {
      width: 90%;
      max-width: 700px;
      background: #fff;
      display: flex;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .signature-left {
      background: #001f3f;
      padding: 30px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 40%;
    }
    .signature-left img {
      width: 100px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #007BFF;
      margin-bottom: 20px;
    }
    .signature-right {
      padding: 30px;
      width: 60%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .signature-right h2 {
      margin: 0;
      color: #2c3e50;
    }
    .signature-right p.title {
      margin: 5px 0 15px;
      color: #7f8c8d;
    }
    .signature-right p {
      margin: 5px 0;
      color: #34495e;
    }
    .signature-right a {
      color: #007BFF;
      text-decoration: none;
    }
    .signature-right .social-icons {
      margin-top: 15px;
    }
    .signature-right .social-icons a {
      margin-right: 10px;
      color: #2c3e50;
      font-weight: bold;
      text-decoration: none;
    }
    .signature-right .social-icons a:hover {
      color: #007BFF;
    }
  </style>
</head>
<body>
  <div class="signature-card">
    <div class="signature-left">
